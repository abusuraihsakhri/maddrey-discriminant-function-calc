[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maddrey-discriminant-function-calc"
version = "1.0.0"
description = "Maddrey Discriminant Function, ABIC, MELD scoring and steroid eligibility for alcoholic hepatitis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dr. Abu Suraih Sakhri"},
]
keywords = ["maddrey", "discriminant-function", "alcoholic-hepatitis", "abic", "meld", "gastroenterology", "clinical-decision-support"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
maddrey-df = "maddrey_df:main"

[tool.setuptools.packages.find]
include = ["maddrey_df*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "test_maddrey_df.py"]
python_files = ["test_*.py"]
addopts = "-v"
